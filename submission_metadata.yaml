ai_usage_summary: |
  Used Claude for architectural discussion, code review, debugging assistance,
  and refactoring suggestions. All scoring logic, ranking heuristics, feature
  engineering, weights, and evaluation decisions were independently designed and
  implemented by the developer. No candidate data was shared with any external
  LLM service. The ranker itself performs no LLM inference and is entirely
  deterministic and offline.

methodology_summary: |
  Recruiter Lens is a deterministic recruiter-inspired ranking engine that
  prioritises career trajectory over keyword matching.

  Five scoring dimensions are combined:
  - Career/title fit (35%)
  - Skill relevance with endorsement trust filter (25%)
  - Experience quality (15%)
  - Location/logistics (10%)
  - Behavioral availability multiplier (±20%)

  The system explicitly penalises non-technical career histories regardless of
  skill listings, preventing keyword-stuffing profiles from ranking highly.

  Skill relevance uses BM25-style exact matching combined with an
  endorsement-duration trust filter that discounts unverified skill claims.
  Honeypot profiles are detected via integrity checks (salary inconsistencies,
  impossible timelines, and expert skills with zero evidence) and are pushed to
  the bottom of rankings.

  The ranking pipeline is deterministic, CPU-only, reproducible, and requires
  no network access or LLM inference. On an 8-core laptop, it processed
  100,000 candidates end-to-end in 75.3 seconds.

