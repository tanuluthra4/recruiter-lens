ai_usage_summary: |
  Used Claude for architectural discussion and code review. All scoring logic,
  weights, JD analysis, and engineering decisions were made by the developer.
  No candidate data was fed to any LLM. The ranker itself uses no LLM calls —
  it is a deterministic, rule-guided semantic scorer.

methodology_summary: |
  Rule-guided semantic ranker with five scoring dimensions: career/title fit
  (35%), skill relevance with endorsement trust filter (25%), experience quality
  (15%), location/logistics (10%), and a behavioral availability multiplier
  derived from Redrob platform signals (±20% modifier on final score).

  The decisive component is career/title fit — it explicitly penalises
  non-technical career histories regardless of skill listings, catching
  keyword-stuffers. The skill component uses BM25-style exact matching gated
  through an endorsement-duration trust filter that halves weight for
  unverified skill claims (0 endorsements + 0 months used). Honeypot profiles
  are detected via data integrity checks (salary min > max, expert skills with
  zero endorsements and zero duration, temporal impossibilities) and pushed to
  rank last. Runtime: ~2–3 minutes on CPU for 100K candidates.

declarations:
  read_submission_spec: true
